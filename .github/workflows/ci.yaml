name: ci
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BEARERTOKEN: ${{ secrets.BEARERTOKEN }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build baton-vultr
        run: go build -o baton-vultr ./cmd/baton-vultr

      - name: Run baton-vultr
        run: ./baton-vultr --bearer-token=${{env.BEARERTOKEN}}

      - name: List Baton Commands
        run: ./baton-vultr --help
